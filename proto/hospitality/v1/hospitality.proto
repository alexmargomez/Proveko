syntax = "proto3";
package proveko.hospitality.v1;
option go_package = "github.com/alexmargomez/proveko/proto/hospitality/v1;hospitalityv1";

service HospitalityService {
  rpc CompleteRoomCheckout(RoomCheckoutEvent) returns (RoomCheckoutResponse);
}

message RoomCheckoutEvent {
  string room_id = 1;
  string invoice_number = 2;
}

message RoomCheckoutResponse {
  bool ok = 1;
  string room_number = 2;
}
