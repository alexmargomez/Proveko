# 3. Microservicio: ms:invoicing (:4103) + Auto-Escalado Horizontal (HPA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-invoicing
  namespace: proveko
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-invoicing
  template:
    metadata:
      labels:
        app: ms-invoicing
        role: ms-host-runner
        microservice: invoicing
    spec:
      containers:
        - name: ms-invoicing
          image: proveko/cluster-node:latest
          ports:
            - containerPort: 4103
          env:
            - name: PROVEKO_NODE_ROLE
              value: "ms-host-runner"
            - name: PROVEKO_PARENT_SERVICE
              value: "ms:invoicing"
            - name: PORT
              value: "4103"
          envFrom:
            - configMapRef:
                name: proveko-cluster-config
            - secretRef:
                name: proveko-cluster-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4103
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ms-invoicing
  namespace: proveko
spec:
  selector:
    app: ms-invoicing
  ports:
    - port: 4103
      targetPort: 4103
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-invoicing-hpa
  namespace: proveko
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-invoicing
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
