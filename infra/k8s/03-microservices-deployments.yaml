# ==============================================================================
# PROVEKO — Microservicios Independientes (`ms:<dominio>`) en Kubernetes
# ==============================================================================
# - Cada Microservicio tiene su propio Deployment, Service (`ClusterIP`) y
#   HorizontalPodAutoscaler (`HPA`).
# - Si agregas un nuevo servidor físico (Worker Node) al clúster de Kubernetes,
#   Kubernetes balancea o mueve los Pods automáticamente (o puedes fijarlo a un
#   servidor dedicado con `nodeSelector`) sin cambiar ninguna URL gracias a CoreDNS.
# ==============================================================================

# 1. Microservicio: ms:crm (:4101)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-crm
  namespace: proveko
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-crm
  template:
    metadata:
      labels:
        app: ms-crm
        role: ms-host-runner
        microservice: crm
    spec:
      containers:
        - name: ms-crm
          image: proveko/cluster-node:latest
          ports:
            - containerPort: 4101
          env:
            - name: PROVEKO_NODE_ROLE
              value: "ms-host-runner"
            - name: PROVEKO_PARENT_SERVICE
              value: "ms:crm"
            - name: PORT
              value: "4101"
          envFrom:
            - configMapRef:
                name: proveko-cluster-config
            - secretRef:
                name: proveko-cluster-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4101
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ms-crm
  namespace: proveko
spec:
  selector:
    app: ms-crm
  ports:
    - port: 4101
      targetPort: 4101
  type: ClusterIP
---
