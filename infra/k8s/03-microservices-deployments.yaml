apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-facturacion
  namespace: proveko
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-facturacion
  template:
    metadata:
      labels:
        app: ms-facturacion
        role: domain-microservice
    spec:
      containers:
        - name: ms-facturacion
          image: proveko/ms-facturacion:latest
          ports:
            - containerPort: 4101
          env:
            - name: SERVICE_NAME
              value: "ms-facturacion"
            - name: PORT
              value: "4101"
            - name: SERVICE_PUBLIC_URL
              value: "http://ms-facturacion.proveko.svc.cluster.local:4101"
          envFrom:
            - configMapRef:
                name: proveko-cluster-config
            - secretRef:
                name: proveko-mesh-verifier-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4101
---
apiVersion: v1
kind: Service
metadata:
  name: ms-facturacion
  namespace: proveko
spec:
  selector:
    app: ms-facturacion
  ports:
    - name: http
      port: 4101
      targetPort: 4101
---
