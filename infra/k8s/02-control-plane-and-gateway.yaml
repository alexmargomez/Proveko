apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-core
  namespace: proveko
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-core
  template:
    metadata:
      labels:
        app: ms-core
        role: api-gateway
    spec:
      containers:
        - name: ms-core
          image: proveko/ms-core:latest
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: SERVICE_NAME
              value: "ms-core"
            - name: PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: proveko-cluster-config
            - secretRef:
                name: proveko-core-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ms-core
  namespace: proveko
spec:
  selector:
    app: ms-core
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-platform
  namespace: proveko
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-platform
  template:
    metadata:
      labels:
        app: ms-platform
        role: domain-microservice
    spec:
      containers:
        - name: ms-platform
          image: proveko/ms-platform:latest
          ports:
            - containerPort: 4100
              name: http
          env:
            - name: SERVICE_NAME
              value: "ms-platform"
            - name: PORT
              value: "4100"
            - name: SERVICE_PUBLIC_URL
              value: "http://ms-platform.proveko.svc.cluster.local:4100"
          envFrom:
            - configMapRef:
                name: proveko-cluster-config
            - secretRef:
                name: proveko-mesh-verifier-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ms-platform
  namespace: proveko
spec:
  selector:
    app: ms-platform
  ports:
    - name: http
      port: 4100
      targetPort: 4100
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-core-hpa
  namespace: proveko
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-core
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proveko-ingress
  namespace: proveko
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ms-core
                port:
                  number: 4000
