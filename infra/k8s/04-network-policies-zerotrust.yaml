apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: microservices-zerotrust-ingress
  namespace: proveko
spec:
  podSelector:
    matchLabels:
      role: domain-microservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: api-gateway
      ports:
        - protocol: TCP
          port: 4100
        - protocol: TCP
          port: 4101
        - protocol: TCP
          port: 4102
        - protocol: TCP
          port: 4103
        - protocol: TCP
          port: 4104
        - protocol: TCP
          port: 4105
        - protocol: TCP
          port: 4106
        - protocol: TCP
          port: 4107
        - protocol: TCP
          port: 4108
        - protocol: TCP
          port: 4109
        - protocol: TCP
          port: 4110
        - protocol: TCP
          port: 4111
        - protocol: TCP
          port: 4112
        - protocol: TCP
          port: 4113
        - protocol: TCP
          port: 4114
        - protocol: TCP
          port: 4115
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-s2s-from-microservices
  namespace: proveko
spec:
  podSelector:
    matchLabels:
      role: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-allow-only-backend-pods
  namespace: proveko
spec:
  podSelector:
    matchLabels:
      app: proveko-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: api-gateway
        - podSelector:
            matchLabels:
              role: domain-microservice
      ports:
        - protocol: TCP
          port: 5432
