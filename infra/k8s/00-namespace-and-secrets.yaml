apiVersion: v1
kind: Namespace
metadata:
  name: proveko
  labels:
    app.kubernetes.io/part-of: proveko-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: proveko-core-secrets
  namespace: proveko
type: Opaque
stringData:
  DB_USER: "proveko_core_admin"
  DB_PASSWORD: "replace_in_vault_core_db_password"
  JWT_SECRET: "replace_in_vault_jwt_signing_secret"
  S2S_SHARED_KEY: "replace_in_vault_s2s_shared_key"
  VAULT_KEK: "replace_in_vault_aes256_kek"
  CORE_PRIVATE_KEY: "replace_in_vault_ed25519_private_key_hex"
  SUPERADMIN_EMAIL: "superadmin@plataforma.local"
  SUPERADMIN_PASSWORD: "replace_in_vault_superadmin_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: proveko-mesh-verifier-secrets
  namespace: proveko
type: Opaque
stringData:
  DB_USER: "proveko_service_app"
  DB_PASSWORD: "replace_in_vault_service_db_password"
  S2S_SHARED_KEY: "replace_in_vault_s2s_shared_key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proveko-cluster-config
  namespace: proveko
data:
  APP_ENV: "production"
  POSTGRES_DB: "control_plane_db"
  DB_HOST: "proveko-db.proveko.svc.cluster.local"
  DB_PORT: "5432"
  DB_SSLMODE: "require"
  GATEWAY_URL: "http://ms-core.proveko.svc.cluster.local:4000"
  MS_PLATFORM_URL: "http://ms-platform.proveko.svc.cluster.local:4100"
  MS_FACTURACION_URL: "http://ms-facturacion.proveko.svc.cluster.local:4101"
  MS_CLIENTES_URL: "http://ms-clientes.proveko.svc.cluster.local:4102"
  MS_INVENTARIO_URL: "http://ms-inventario.proveko.svc.cluster.local:4103"
  MS_CAJA_URL: "http://ms-caja.proveko.svc.cluster.local:4104"
  MS_COMANDAS_URL: "http://ms-comandas.proveko.svc.cluster.local:4105"
  MS_HOTELERIA_URL: "http://ms-hoteleria.proveko.svc.cluster.local:4106"
  MS_TALLER_URL: "http://ms-taller.proveko.svc.cluster.local:4107"
  MS_BASCULA_URL: "http://ms-bascula.proveko.svc.cluster.local:4108"
  MS_COMPRAS_URL: "http://ms-compras.proveko.svc.cluster.local:4109"
  MS_AGENDA_URL: "http://ms-agenda.proveko.svc.cluster.local:4110"
  MS_TAQUILLA_URL: "http://ms-taquilla.proveko.svc.cluster.local:4111"
  MS_NOMINA_URL: "http://ms-nomina.proveko.svc.cluster.local:4112"
  MS_CONTABILIDAD_URL: "http://ms-contabilidad.proveko.svc.cluster.local:4113"
  MS_REPORTES_URL: "http://ms-reportes.proveko.svc.cluster.local:4114"
  MS_IMPRESIONES_URL: "http://ms-impresiones.proveko.svc.cluster.local:4115"
