apiVersion: v1
kind: Namespace
metadata:
  name: proveko
  labels:
    app.kubernetes.io/part-of: proveko-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: proveko-cluster-secrets
  namespace: proveko
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "proveko_master_secret_2026"
  JWT_ACTIVE_KID: "kid-proveko-k8s-2026"
  JWT_MASTER_SEED: "proveko_k8s_ed25519_master_seed_2026"
  PROVEKO_CLUSTER_SECRET: "proveko_k8s_cluster_hmac_secret_2026"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proveko-cluster-config
  namespace: proveko
data:
  POSTGRES_DB: "proveko_control_db"
  DB_HOST: "proveko-db.proveko.svc.cluster.local"
  DB_PORT: "5432"
  # Service Discovery nativo de Kubernetes (CoreDNS):
  # Kubernetes enruta y balancea automáticamente hacia los Pods de cada Microservicio,
  # sin importar en qué servidor físico (Worker Node) estén corriendo.
  UPSTREAM_MS_CRM: "http://ms-crm.proveko.svc.cluster.local:4101"
  UPSTREAM_MS_INVENTORY: "http://ms-inventory.proveko.svc.cluster.local:4102"
  UPSTREAM_MS_INVOICING: "http://ms-invoicing.proveko.svc.cluster.local:4103"
  UPSTREAM_MS_GASTRO: "http://ms-gastro.proveko.svc.cluster.local:4104"
  UPSTREAM_MS_HOTEL: "http://ms-hotel.proveko.svc.cluster.local:4105"
  UPSTREAM_MS_FINANCE: "http://ms-finance.proveko.svc.cluster.local:4106"
