services:
  db:
    image: postgres:16-alpine
    container_name: proveko_db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proveko_control_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proveko_master_secret_2026}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-proveko_control_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  core:
    image: proveko-go:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proveko_core
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      FRONTEND_PORT: 5173
      BACKEND_PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-proveko_control_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proveko_master_secret_2026}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_URL: ${APP_URL:-http://localhost:4000}
      JWT_MASTER_SEED: ${JWT_MASTER_SEED:-proveko_alpanel_jwt_master_seed_2026}
      PROVEKO_CLUSTER_SECRET: ${PROVEKO_CLUSTER_SECRET:-proveko_alpanel_cluster_hmac_secret_2026}
      PROVEKO_VAULT_KEK: ${PROVEKO_VAULT_KEK:-proveko_alpanel_aes256_kek_master_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
