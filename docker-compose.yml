      PROVEKO_NODE_ID: container:ms:gastro
      PROVEKO_PARENT_SERVICE: ms:gastro
      ENABLED_MODULES: ${ENABLED_MODULES_GASTRO:-*}
      PORT: 4104
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proveko_master_secret_2026}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-kid-proveko-cluster-2026}
      JWT_MASTER_SEED: ${JWT_MASTER_SEED:-proveko_alpanel_ed25519_master_seed_2026}
      PROVEKO_CLUSTER_SECRET: ${PROVEKO_CLUSTER_SECRET:-proveko_alpanel_cluster_hmac_secret_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # 9. Microservicio Independiente: ms:hotel (Módulos: mod:hotel-rooms, mod:hotel-bookings, mod:hotel-frontdesk)
  ms-hotel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proveko_ms_hotel
    restart: unless-stopped
