x-service-env: &service-common-env
  APP_ENV: ${APP_ENV:-development}
  DB_HOST: db
  DB_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-control_plane_db}
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_secret_2026}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  S2S_SHARED_KEY: ${S2S_SHARED_KEY:-change_me_64_char_s2s_mesh_shared_key_2026}
  GATEWAY_URL: ${GATEWAY_URL:-http://core:4000}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4000,http://localhost:5173}

services:
  db:
    image: postgres:16-alpine
    container_name: proveko_db
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=600"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_plane_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_secret_2026}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-control_plane_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mesh

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: proveko_core
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      <<: *service-common-env
      SERVICE_NAME: ms-core
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change_me_64_char_jwt_signing_secret_2026}
      VAULT_KEK: ${VAULT_KEK:-change_me_64_char_aes256_vault_kek_2026}
      CORE_ED25519_SEED: ${CORE_ED25519_SEED:-change_me_ed25519_seed_32_bytes!}
      CORE_PRIVATE_KEY: ${CORE_PRIVATE_KEY:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@plataforma.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-ChangeMeSuperAdmin2026*}
      MS_PLATFORM_URL: http://ms-platform:4100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mesh

  ms-platform:
    build:
      context: ./services/ms-platform
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-common-env
      SERVICE_NAME: ms-platform
      PORT: 4100
      SERVICE_PUBLIC_URL: http://ms-platform:4100
    depends_on:
      core:
        condition: service_healthy
    networks:
      - mesh

  ms-facturacion:
    build:
      context: ./services/ms-facturacion
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-common-env
      SERVICE_NAME: ms-facturacion
      PORT: 4101
      SERVICE_PUBLIC_URL: http://ms-facturacion:4101
    depends_on:
      db:
        condition: service_healthy
      core:
